name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --group dev

      # Runs every gate (hygiene, detect-secrets, ruff, flynt, vulture, xenon,
      # mypy --strict, custom taste hooks, Codex-sync check, pytest + coverage
      # ratchet) so CI matches the local pre-commit exactly.
      - name: Pre-commit (lint, types, complexity, tests, coverage)
        run: uv run pre-commit run --all-files --show-diff-on-failure
