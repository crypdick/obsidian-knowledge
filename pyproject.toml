[project]
name = "obsidian-knowledge"
version = "3.24.4"
description = "Obsidian vault knowledge integration for Claude Code and Codex"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "memweave>=0.2.1,<0.3",
    # Older LiteLLM releases pinned tokenizers builds that fail on Python 3.14.
    "litellm>=1.100.0,<2",
    "platformdirs>=4.9.6",
    "botocore>=1.43.10",
    "beartype>=0.22.9",
    "httpx[socks]>=0.28.1",
]

[project.scripts]
obsidian-knowledge = "lib.vault_index.cli:cli_main"
obsidian-knowledge-check = "hooks.i_insist:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.hatch.build.targets.sdist]
# Keep platform/editor detritus out even when the source checkout is dirty.
exclude = [
    ".coverage", ".coverage.*", "coverage.json",
    ".DS_Store?", ".Spotlight-V100", ".Trashes", "._*", "Thumbs.db",
    "ehthumbs.db", "*.egg-info", "*.swp", "*~",
]

[tool.hatch.build.targets.wheel.force-include]
hooks = "hooks"
"hooks/vault_registry.py" = "vault_registry.py"

[dependency-groups]
dev = [
    "check-sdist",
    "deptry",
    "detect-secrets>=1.5.0",
    "flynt>=1.0.6",
    "mypy>=2.1.0",
    "prek",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12.20260518",
    "vulture>=2.16",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-awesome-pages-plugin>=2.10.1,<3",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1,<2",
    "mkdocs-include-markdown-plugin>=7.2.1,<8",
    "mkdocs-material>=9.7.1,<10",
    "mkdocs-minify-plugin>=0.8.0,<1",
]

[tool.new-feature]
target_branch = "main"
setup = ["uv sync --group dev"]
pre_merge = ["uv run prek run --all-files --show-diff-on-failure"]
post_merge = ["uv run prek run --all-files --show-diff-on-failure"]
teardown = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--no-header -n auto --maxprocesses=4 -q --durations=5 --durations-min=1.0 --failed-first"
timeout = 30
timeout_method = "thread"

[tool.ruff]
target-version = "py312"
line-length = 110
# plugins/obsidian-knowledge is a generated copy of the root (see
# scripts/sync_codex_plugin.py) -- lint the source of truth only. docs/ holds
# documentation and frozen plans/specs; do not rewrite archived code blocks.
extend-exclude = ["plugins/obsidian-knowledge", "docs/"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
# Fit for host-loaded adapters: annotation migration and path/API style rules
# remain review conventions; enforce bug-shaped rules without changing interfaces.
select = [
    "E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "C90",
    "A", "ASYNC", "COM818", "D402", "D414", "D418", "D419",
    "DOC102", "DOC202", "DOC403", "DTZ", "FA", "G", "LOG",
    "ISC004", "PGH", "PIE", "PLE", "RSE", "SLOT", "T10", "T20", "TID", "YTT",
    "S102", "S103", "S104", "S106", "S107", "S110", "S112",
    "S201", "S202", "S301", "S302", "S306", "S307", "S324",
    "S501", "S506", "S508", "S509", "S602", "S605", "S606", "S608", "S612", "S701",
    "TRY201", "TRY203", "TRY400", "TRY401",
]
ignore = [
    "E501",    # line-length deferred to the formatter
    "RUF003",  # ambiguous-unicode-in-comment: em-dashes in prose comments are intentional
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Idiomatic test patterns: captured-but-unused unpacking, exact-float asserts on
# representable literals, async test-doubles matching an interface, [..][0] slices.
"scripts/**/*.py" = ["C901", "T20"]
# stdout is the protocol at hook and standalone-tool boundaries.
"hooks/**/*.py" = ["T201"]
"skills/**/*.py" = ["T201"]
"spikes/**/*.py" = ["T201"]
"**/cli.py" = ["T201"]
"tests/**/*.py" = ["F841", "C901", "SIM", "RUF059", "RUF069", "RUF029", "RUF015", "T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
# hookslib lives at hooks/hookslib, so hook scripts import it as `hookslib.*`.
mypy_path = "hooks"
# First mypy adoption on an existing codebase: keep the two pragmatic exceptions
# strictify ships by default so the diff stays focused on real type errors, not
# annotating every internal helper. Real bugs (arg-type, type-arg, ...) still fail.
disable_error_code = ["no-untyped-call", "no-untyped-def"]

# memweave and botocore ship without stubs.
[[tool.mypy.overrides]]
module = ["memweave.*", "botocore.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["lib", "hooks"]
omit = ["*/tests/*", "*/test_*.py", "*/__pycache__/*", "*/conftest.py"]

[tool.coverage.report]
# NOTE: measured branch-coverage ratchet; see docs/QUALITY.md. Target: 100%.
fail_under = 100
precision = 2
skip_empty = true
exclude_also = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.vulture]
min_confidence = 80
paths = ["lib", "hooks"]
exclude = [".venv/", "plugins/"]
ignore_names = ["kwargs"]

[tool.uv]
exclude-newer = "3 days"

[tool.deptry]
extend_exclude = ["plugins/", "scripts/", "skills/", "spikes/"]
known_first_party = ["lib", "vault_index", "hooks", "hookslib", "vault_registry"]

[tool.deptry.per_rule_ignores]
# Explicit compatibility constraints for memweave's lazy embedding stack;
# httpx[socks] supplies proxy support. Keep these even without direct imports.
DEP002 = ["litellm", "botocore", "httpx"]
# scan-vault-secrets.py declares its runtime dependencies in PEP 723 metadata.
DEP004 = ["detect_secrets"]
