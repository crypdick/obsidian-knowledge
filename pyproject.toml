[project]
name = "obsidian-knowledge"
version = "3.20.0"
description = "Obsidian vault knowledge integration for Claude Code and Hermes Agent CLI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "memweave>=0.1",
    "platformdirs>=4.9.6",
]

[project.scripts]
obsidian-knowledge = "lib.vault_index.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
]
