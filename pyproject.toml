[project]
name = "obsidian-knowledge"
version = "3.22.21"
description = "Obsidian vault knowledge integration for Claude Code and Hermes Agent CLI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "memweave>=0.1",
    "platformdirs>=4.9.6",
    "botocore>=1.43.10",
]

[project.scripts]
obsidian-knowledge = "lib.vault_index.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.hatch.build.targets.wheel.force-include]
hooks = "hooks"
hermes_plugin = "hermes_plugin"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# The Codex plugin tree is a generated copy of the root (see
# scripts/sync_codex_plugin.py); lint the source of truth only.
extend-exclude = ["plugins/obsidian-knowledge"]
